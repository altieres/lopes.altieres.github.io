<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Altieres Lopes — site em construção</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg: #07090d;
        --fg: #f1f5f9;
        --muted: #94a3b8;
        --accent: #38bdf8;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at 15% 20%, rgba(56, 189, 248, 0.25), transparent 55%),
          radial-gradient(circle at 85% 30%, rgba(167, 139, 250, 0.2), transparent 60%),
          var(--bg);
        font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        color: var(--fg);
        text-align: center;
        padding: 3rem 1.5rem;
      }
      main {
        max-width: 540px;
        display: grid;
        gap: 1.5rem;
        background: rgba(8, 11, 18, 0.75);
        border: 1px solid rgba(148, 163, 184, 0.2);
        border-radius: 24px;
        padding: 3rem 2.5rem;
        box-shadow: 0 24px 60px rgba(2, 6, 14, 0.55);
      }
      h1 {
        margin: 0;
        font-size: clamp(2rem, 5vw, 2.8rem);
        line-height: 1.1;
      }
      p {
        margin: 0;
        color: var(--muted);
        font-size: 1.05rem;
        line-height: 1.6;
      }
      a {
        color: var(--accent);
        font-weight: 600;
        text-decoration: none;
      }
      a:hover,
      a:focus {
        text-decoration: underline;
      }
      footer {
        margin-top: 1.5rem;
        font-size: 0.9rem;
        color: rgba(148, 163, 184, 0.7);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Altieres Lopes</h1>
      <p>Este espaço está sendo preparado para reunir projetos, artigos e notas de Altieres Lopes.</p>
      <p>
        Enquanto isso, acompanhe o projeto principal em
        <a href="https://altieres.com.br">altieres.com.br</a> ou escreva para
        <a href="mailto:altieres@altieres.com.br">altieres@altieres.com.br</a>.
      </p>
      <footer>&copy; <span id="year"></span> Altieres Lopes — em breve novidades.</footer>
    </main>
    <script>
      document.getElementById('year').textContent = new Date().getFullYear();
    </script>
  </body>
</html>
